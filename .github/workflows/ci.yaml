name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Require at least 70 percent statement coverage
        run: go tool cover -func=coverage.out | awk '/^total:/ { if ($3+0 < 70) exit 1 }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pg-backup:ci
      # - name: PostgreSQL 14, 16 and 17 restore drills
      #   run: BACKUP_IMAGE=pg-backup:ci bash tests/integration/run.sh
