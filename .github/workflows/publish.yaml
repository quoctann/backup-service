name: Publish image
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go test ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: postgres-backup:test
      # - name: Verify real restores before publishing
      #   run: bash tests/integration/run.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Full commit SHA only; semver releases are a future idea, not implemented.
          tags: type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment update
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_PAT }}
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          gh api --method POST
          repos/quoctann/pisces-infra/actions/workflows/deploy-backup-service.yml/dispatches
          -f ref=main
          -f "inputs[image_tag]=$IMAGE_TAG"
